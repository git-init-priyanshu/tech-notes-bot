name = "tech-notes-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[triggers]
crons = ["0 */2 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tech-notes"
database_id = "PASTE_DATABASE_ID_HERE"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5"
TZ_OFFSET_MINUTES = "330"
ACTIVE_HOURS = "8-23"
